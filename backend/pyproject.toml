[project]
name = "swift-agent"
version = "0.1.0"
description = "Multi-agent platform built on FastAPI + LangChain + DeepAgents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yang Cao" }]
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "deepagents>=0.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
