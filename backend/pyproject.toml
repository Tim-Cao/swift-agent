[project]
name = "swift-agent"
version = "0.1.0"
description = "Multi-agent platform built on FastAPI + LangChain + DeepAgents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yang Cao" }]
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "deepagents>=0.1",
  "langchain-mcp-adapters>=0.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "chardet>=5.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-json-report>=1.5",
  "allure-pytest>=2.13",
  "jinja2>=3.1",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: 单元测试",
  "integration: 集成测试",
  "e2e: 端到端测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"
